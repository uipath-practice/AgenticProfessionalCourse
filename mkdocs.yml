site_name: Agentic Automation Workshop
site_url: https://uipath-practice.github.io/AgenticCodingAgents/
site_description: Participant's handbook for the UiPath Agentic Automation Workshop — build an end-to-end agentic Benefit Claims process.
site_author: Mihai Iorga

theme:
  name: material
  logo: assets/images/Partner Success Logo.png
  favicon: assets/images/favicon.png
  font:
    text: Inter
  palette:
    scheme: default
    primary: deep orange
    accent: orange
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.integrate
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link

hooks:
  - hooks/split_cols.py

plugins:
  - search
  # Localization — see Master/Localization.md. English is the master language,
  # built at the site root. Other languages build under /<locale>/ and fall
  # back to English for any page without a translation.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          build: true
          default: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Prerequisites:
    - Overview: prerequisites/index.md
    - Installation Guides: prerequisites/installation-guides.md
  - Getting Started with Coding Agents:
    - 1. Practicing the CLI: getting-started-with-coding-agents/1-practice-the-cli.md
    - 2. Build Your First Agent: getting-started-with-coding-agents/2-build-your-first-agent.md
    - You did it!: getting-started-with-coding-agents/you-did-it.md
  # Exercise sections are inserted here by /publish-exercise.
  # `- Next Steps: next-steps.md` MUST remain the last entry: publish-exercise
  # inserts each new exercise block immediately before it, and
  # scripts/translation_status.py scrapes this block to tell published from draft.
  - Benefit Claims Processing:
    - Overview: benefit-claims-processing/index.md
    - 1. Automating Business Processes using BPMN canvas: benefit-claims-processing/1-create-bpmn-process.md
    - 2. Setting up the Solution: benefit-claims-processing/2-setting-up-the-solution.md
    - 3. Add an RPA automation to your Maestro workflow: benefit-claims-processing/3-configure-a-robot.md
    - 4. Build the Residency Verification Agent: benefit-claims-processing/4-residency-verification-agent.md
    - 5. Build the Income Verification Agent: benefit-claims-processing/5-income-verification-agent.md
    - 6. Build the Eligibility Determination Agent: benefit-claims-processing/6-eligibility-determination-agent-coded.md
    - 7. Add an Action App for human validation: benefit-claims-processing/7-configure-human-validation.md
    - 8. Update external systems using API — Benefit Approval Case: benefit-claims-processing/8-configure-api-integration-benefit-approval.md
    - 9. Update external systems using API — Benefit Rejection Case: benefit-claims-processing/9-configure-api-integration-benefit-rejection.md
    - 10. Benefit Claims Assistant - Conversational Agent: benefit-claims-processing/10-benefit-claims-assistant-conversational-agent.md
    - 11. Publish the Solution: benefit-claims-processing/11-publish-the-solution.md
  - Next Steps: next-steps.md

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

extra:
  generator: false
